<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      p.timestamp = message.timestamp;
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G Dev Pro • Groq</title>
<style>
:root{
  --bg:#060708;
  --bg2:#0a0c10;
  --panel:#0f131b;
  --panel-2:#111621;
  --border:#1c2333;
  --border-2:#263245;
  --text:#e6ebf2;
  --muted:#8b96ab;
  --user:#151b26;
  --assistant:#0e1420;
  --code:#02060c;
  --accent:#f97316;
  --accent2:#a855f7;
  --ok:#22c55e;
  --err:#ef4444;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial; -webkit-font-smoothing:antialiased}
.app{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(1200px 800px at 80% -10%, #1a1540 0%, transparent 60%), radial-gradient(900px 600px at -10% 20%, #1e0f1a 0%, transparent 55%), var(--bg)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(6,7,8,.6);backdrop-filter:saturate(140%) blur(16px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#0b0b0b;font-weight:900;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas;box-shadow:0 6px 20px #a855f733, inset 0 0 20px #ffffff22}
.brand small{color:var(--muted);font-weight:500}
.icon-btn{background:#0c111a;border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;transition:.2s}
.icon-btn:hover{color:var(--text);border-color:var(--border-2);transform:translateY(-1px)}
#chat{flex:1;overflow-y:auto;padding:28px 16px 24px;max-width:920px;width:100%;margin:0 auto}
.msg{display:flex;gap:12px;margin:0 auto 18px;max-width:880px;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:13px;font-weight:700;background:#0d1320;border:1px solid var(--border);color:#b7c1d3;box-shadow:inset 0 0 0 1px #ffffff0a}
.msg.user .avatar{background:#0a0f18}
.msg.assistant .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0a0a;border:0;box-shadow:0 4px 14px #a855f755}
.bubble{flex:1;min-width:0;background:var(--assistant);border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:0 4px 18px #00000040}
.msg.user .bubble{background:var(--user);border-color:#1f2a3c}
.content{white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.7;color:#dbe3f0}
.content strong{color:#fff;font-weight:700}
code.inline{background:#00000066;border:1px solid #ffffff14;padding:.15em .4em;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas;font-size:13px;color:#ffe4c4}
.code-wrap{margin:12px 0;border:1px solid #1b2436;border-radius:12px;overflow:hidden;background:var(--code);box-shadow:0 10px 30px #00000070}
.code-top{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 12px;background:#080c14;border-bottom:1px solid #141c2b;font-size:12px;color:#8fa0ba}
.code-top span{font-family:ui-monospace; text-transform:lowercase; letter-spacing:.3px}
.copy{display:flex;align-items:center;gap:6px;background:#0f1522;border:1px solid #223049;color:#a9b4c7;padding:5px 9px;border-radius:8px;font-size:12px;cursor:pointer;transition:.15s}
.copy:hover{background:#141c2c;color:#e2e8f0;border-color:#2c3a54}
.copy:active{transform:scale(.97)}
.code-wrap pre{margin:0;padding:14px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Consolas,Menlo; font-size:13px; line-height:1.55; color:#e6ebf3; white-space:pre; tab-size:2}
.typing .bubble{display:inline-flex; padding:12px 16px}
.dots{display:flex;gap:5px;align-items:center}
.dots span{width:6px;height:6px;border-radius:50%;background:#7a879e;opacity:.7;animation:b .9s infinite}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-4px);opacity:1}}
footer{position:sticky;bottom:0;z-index:15;padding:16px 12px 22px;background:linear-gradient(180deg,transparent,rgba(6,7,8,.85) 25%, var(--bg) 70%)}
.composer{max-width:920px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:8px 8px 8px 12px;box-shadow:0 12px 40px #00000080, inset 0 1px 0 #ffffff08}
.composer textarea{flex:1;background:transparent;border:0;outline:0;color:var(--text);resize:none;max-height:180px;min-height:24px;padding:8px 4px;font-size:15px;line-height:1.5;font-family:inherit}
.composer button.send{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#0a0a0a;font-weight:800;padding:10px 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:0 6px 18px #a855f74d;transition:.15s}
.composer button.send:hover{transform:translateY(-1px);filter:saturate(1.1)}
.composer button.send:disabled{opacity:.5;cursor:not-allowed;transform:none}
.hint{max-width:920px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--muted)}
.error{max-width:880px;margin:10px auto;padding:10px 14px;background:#2a0b0f;border:1px solid #7f1d1d;color:#fca5a5;border-radius:12px;font-size:14px}
.modal-backdrop{position:fixed;inset:0;background:rgba(3,5,8,.75);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-backdrop.show{display:flex}
.modal{width:100%;max-width:440px;background:linear-gradient(180deg,#101623,#0c111b);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 30px 80px #000000c0}
.modal h2{margin:0 0 6px;font-size:22px;letter-spacing:.2px}
.modal p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.55}
.key-field{position:relative;margin:14px 0}
.key-field input{width:100%;background:#070b13;color:var(--text);border:1px solid #223049;border-radius:12px;padding:12px 42px 12px 14px;font-family:ui-monospace;font-size:14px;outline:0;transition:.15s}
.key-field input:focus{border-color:#a855f7;box-shadow:0 0 0 3px #a855f733}
.key-field .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#7e8aa3;cursor:pointer;padding:6px;border-radius:8px}
.key-field .toggle:hover{color:#cbd5e1;background:#0f1623}
.modal .save{width:100%;margin-top:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#0a0a0a;font-weight:800;padding:12px;border-radius:12px;cursor:pointer;font-size:15px;box-shadow:0 8px 22px #a855f740}
.modal small{display:block;text-align:center;margin-top:10px;color:#7f8aa3;font-size:12px}
.link{color:#b493ff;text-decoration:none}
.link:hover{text-decoration:underline}
@media (max-width:640px){
  #chat{padding:18px 12px}
  .bubble{padding:12px 14px;border-radius:14px}
  .content{font-size:14.5px}
  .avatar{width:28px;height:28px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">G</div>
      <div>G Dev Pro <small>• Groq</small></div>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Configurar chave">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83l.06-.06a1.65 0 0 0 .33-1.82 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </header>

  <main id="chat"></main>

  <footer>
    <form class="composer" id="composer">
      <textarea id="prompt" placeholder="Peça HTML, CSS, JS ou Python..." rows="1"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Enviar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        Enviar
      </button>
    </form>
    <div class="hint">Sua chave fica só no seu navegador. Modelo: llama-3.3-70b-versatile</div>
  </footer>
</div>

<div class="modal-backdrop" id="keyModal">
  <div class="modal">
    <h2>Conectar à Groq</h2>
    <p>Cole sua API key da Groq para começar. Ela será salva apenas localmente. Obtenha em <a class="link" href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>.</p>
    <div class="key-field">
      <input id="keyInput" type="password" placeholder="gsk_..." autocomplete="off" spellcheck="false">
      <button class="toggle" id="toggleKey" type="button" title="Mostrar/ocultar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="save" id="saveKey">Conectar</button>
    <small>Sua chave fica só no seu navegador.</small>
  </div>
</div>

<script>
(() => {
  const systemPrompt = "Você é G Dev, engenheiro sênior especialista em HTML, CSS, JavaScript, Python, React, Tailwind. Responda em português do Brasil, direto. Sempre entregue código completo funcional em blocos markdown.";
  const chat = document.getElementById('chat');
  const composer = document.getElementById('composer');
  const promptEl = document.getElementById('prompt');
  const sendBtn = document.getElementById('sendBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const keyModal = document.getElementById('keyModal');
  const keyInput = document.getElementById('keyInput');
  const saveKeyBtn = document.getElementById('saveKey');
  const toggleKey = document.getElementById('toggleKey');

  let history = [];
  let sending = false;

  const escapeHtml = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function renderMarkdown(md){
    let html = escapeHtml(md);
    html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) => {
      const l = (lang || 'code').toLowerCase();
      const id = 'c' + Math.random().toString(36).slice(2,9);
      return `<div class="code-wrap"><div class="code-top"><span>${l}</span><button class="copy" data-id="${id}" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>copiar</button></div><pre><code id="${id}">${code.trim()}</code></pre></div>`;
    });
    html = html.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return html;
  }

  function addMessage(role, content){
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const avatar = role === 'user'
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`
      : 'G';
    const inner = role === 'assistant' ? renderMarkdown(content) : escapeHtml(content);
    wrap.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble"><div class="content">${inner}</div></div>`;
    chat.appendChild(wrap);
    wrap.querySelectorAll('.copy').forEach(btn => {
      btn.addEventListener('click', () => copyCode(btn));
    });
    scrollBottom();
  }

  function copyCode(btn){
    const id = btn.dataset.id;
    const el = document.getElementById(id);
    if(!el) return;
    const text = el.textContent;
    navigator.clipboard.writeText(text).then(()=>{
      const old = btn.innerHTML;
      btn.innerHTML = 'copiado!';
      btn.disabled = true;
      setTimeout(()=>{ btn.innerHTML = old; btn.disabled = false; }, 1400);
    });
  }

  function addError(msg){
    const e = document.createElement('div');
    e.className = 'error';
    e.textContent = '⚠ ' + msg;
    chat.appendChild(e);
    scrollBottom();
  }

  function showTyping(){
    const t = document.createElement('div');
    t.className = 'msg assistant typing';
    t.id = 'typing';
    t.innerHTML = `<div class="avatar">G</div><div class="bubble"><div class="dots"><span></span><span></span></div></div>`;
    chat.appendChild(t);
    scrollBottom();
  }
  function hideTyping(){ document.getElementById('typing')?.remove(); }

  function scrollBottom(){ chat.scrollTop = chat.scrollHeight; }

  function openKeyModal(){
    keyInput.value = localStorage.getItem('groq_key') || '';
    keyModal.classList.add('show');
    setTimeout(()=> keyInput.focus(), 50);
  }
  function closeKeyModal(){ keyModal.classList.remove('show'); }

  function initChat(){
    history = [{role:'assistant', content:'Pronto. Colei a Groq. Manda o que precisa em HTML, CSS, JS ou Python.'}];
    chat.innerHTML = '';
    history.forEach(m => addMessage(m.role, m.content));
  }

  async function callGroq(){
    const key = localStorage.getItem('groq_key');
    if(!key) throw new Error('Sem chave. Configure nas configurações.');
    const messages = [{role:'system', content:systemPrompt}, ...history.slice(-8)];
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Authorization':`Bearer ${key}`,'Content-Type':'application/json'},
      body: JSON.stringify({model:'llama-3.3-70b-versatile',messages,temperature:0.2,max_tokens:3000,stream:false})
    });
    if(!resp.ok){
      let msg = `Erro ${resp.status}`;
      try{ const j=await resp.json(); msg = j.error?.message || msg; }catch{}
      if(resp.status===401) throw new Error('Chave inválida. Abra as configurações e corrija.');
      throw new Error(msg);
    }
    const data = await resp.json();
    return data.choices?.[0]?.message?.content || 'Sem resposta.';
  }

  async function handleSend(e){
    e?.preventDefault();
    if(sending) return;
    const text = promptEl.value.trim();
    if(!text) return;
    const key = localStorage.getItem('groq_key');
    if(!key){ openKeyModal(); return; }

    sending = true;
    sendBtn.disabled = true;
    addMessage('user', text);
    history.push({role:'user', content:text});
    promptEl.value = '';
    autoResize();
    showTyping();

    try{
      const reply = await callGroq();
      hideTyping();
      addMessage('assistant', reply);
      history.push({role:'assistant', content:reply});
    }catch(err){
      hideTyping();
      addError(err.message);
      if(/inválida/i.test(err.message)) openKeyModal();
    }finally{
      sending = false;
      sendBtn.disabled = false;
      promptEl.focus();
    }
  }

  function autoResize(){
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 180) + 'px';
  }

  // events
  composer.addEventListener('submit', handleSend);
  promptEl.addEventListener('input', autoResize);
  promptEl.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }
  });
  settingsBtn.addEventListener('click', openKeyModal);
  saveKeyBtn.addEventListener('click', ()=>{
    const k = keyInput.value.trim();
    if(!k){ alert('Cole sua chave gsk_...'); return; }
    if(!k.startsWith('gsk_')){ if(!confirm('A chave geralmente começa com gsk_. Salvar mesmo assim?')) return; }
    localStorage.setItem('groq_key', k);
    closeKeyModal();
  });
  toggleKey.addEventListener('click', ()=>{
    keyInput.type = keyInput.type === 'password' ? 'text' : 'password';
  });
  keyModal.addEventListener('click', (e)=>{ if(e.target===keyModal) closeKeyModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && keyModal.classList.contains('show')) closeKeyModal(); });

  // init
  window.addEventListener('DOMContentLoaded', ()=>{
    if(!localStorage.getItem('groq_key')) openKeyModal();
    initChat();
    autoResize();
    promptEl.focus();
  });
})();
</script>
</body>
</html>
