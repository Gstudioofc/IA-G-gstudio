<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      p.timestamp = message.timestamp;
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>G v2 — conversador</title>
<style>
  :root{
    --bg:#0a0a0f;
    --panel:#0f0f15cc;
    --bubble-g:#15151d;
    --bubble-g-b:#23232f;
    --text:#e7e7ea;
    --muted:#8a8a93;
    --accent:#00d4ff;
    --accent2:#00a8d4;
    --green:#22c55e;
    --red:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 50% -220px,rgba(0,212,255,.14),transparent 60%),radial-gradient(700px 400px at 90% 110%,rgba(0,212,255,.07),transparent 60%);pointer-events:none;z-index:0}
  .app{position:relative;z-index:1;max-width:840px;height:100dvh;margin:0 auto;display:flex;flex-direction:column}

  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--panel);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid #1a1a24}
  .left{display:flex;align-items:center;gap:12px}
  .avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#001219;background:linear-gradient(135deg,var(--accent),#7ee7ff);box-shadow:0 0 24px rgba(0,212,255,.25), inset 0 0 12px rgba(255,255,255,.2)}
  .title{display:flex;flex-direction:column;line-height:1.1}
  .name{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#b6f5d1;font-weight:500}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

  #chat{flex:1;overflow-y:auto;padding:18px 14px 0;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  #chat::-webkit-scrollbar{width:8px} #chat::-webkit-scrollbar-thumb{background:#1c1c25;border-radius:8px}

  .message{max-width:86%;display:flex;flex-direction:column;gap:4px;animation:in .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .message.user{align-self:flex-end;align-items:flex-end}
  .message.g{align-self:flex-start;align-items:flex-start}

  .bubble{position:relative;padding:11px 14px;border-radius:18px;line-height:1.38;font-size:15px;word-wrap:break-word;white-space:pre-wrap;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .message.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#002027;border-bottom-right-radius:6px}
  .message.g .bubble{background:var(--bubble-g);border:1px solid var(--bubble-g-b);color:var(--text);border-bottom-left-radius:6px}
  .message.error .bubble{border-color:rgba(239,68,68,.5)}

  .stamp{font-size:11px;color:var(--muted);padding:0 4px}
  
  .source{margin-top:8px;padding-top:7px;border-top:1px dashed #2a2a38;font-size:11.5px;color:#9da3af;line-height:1.3}
  .retry{margin-top:8px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;border:1px solid rgba(0,212,255,.35);background:rgba(0,212,255,.08);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
  .retry:hover{background:rgba(0,212,255,.15);transform:translateY(-1px)}
  .retry:active{transform:translateY(0)}

  .typing{display:inline-flex;gap:4px;padding:2px 2px}
  .typing span{width:6px;height:6px;border-radius:50%;background:#6f7685;opacity:.6;animation:b 1.3s infinite}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

  .bottom{position:sticky;bottom:0;z-index:9;background:linear-gradient(180deg,transparent,rgba(10,10,15,.8) 20%,rgba(10,10,15,.95) 60%);padding:10px 12px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
  .disclaimer{text-align:center;font-size:11px;color:#7c85;margin:4px 0 10px}
  .input-wrap{display:flex;align-items:end;gap:8px;background:#0e0e14;border:1px solid #1e1e28;border-radius:18px;padding:8px 8px 8px 14px;box-shadow:0 8px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.02)}
  .input-wrap:focus-within{border-color:rgba(0,212,255,.5);box-shadow:0 0 0 3px rgba(0,212,255,.12)}
  #input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:16px;line-height:1.4;max-height:140px;resize:none;padding:6px 0;font-family:inherit}
  #input::placeholder{color:#6b6b76}
  #send{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#00141a;display:grid;place-items:center;flex-shrink:0;transition:.2s;box-shadow:0 6px 18px rgba(0,212,255,.28)}
  #send:disabled{opacity:.45;filter:grayscale(.3);cursor:not-allowed;box-shadow:none}
  #send:not(:disabled):hover{transform:translateY(-1px) scale(1.03)}
  #send:not(:disabled):active{transform:translateY(0) scale(.98)}
  #send svg{width:20px;height:20px}

  @media (min-width:700px){
    .message{max-width:68%}
    #chat{padding:24px 24px 0}
    header{padding:14px 22px}
    .bottom{padding:14px 22px calc(14px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="left">
        <div class="avatar">G</div>
        <div class="title">
          <div class="name">G <span class="status"><span class="dot"></span>online</span></div>
        </div>
      </div>
      <div class="time" id="hora">--:--</div>
    </header>

    <main id="chat" aria-live="polite"></main>

    <div class="bottom">
      <div class="disclaimer">O G é uma IA e pode cometer erros. Confira sempre.</div>
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Fala com o G..." autocomplete="off" enterkeyhint="send"></textarea>
        <button id="send" aria-label="Enviar" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

<script>
  // Elementos principais
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const horaEl = document.getElementById('hora');

  // Prompt do sistema - mineiro
  const systemPrompt = "Você é o G, um assistente mineiro de Minas Gerais. Fala direto, usa 'uai' às vezes, é bem-humorado, responde em até 3 frases. Nunca inventa dados factuais sem avisar.";

  let enviando = false;

  // Hora no topo
  function atualizaHora(){
    const d = new Date();
    horaEl.textContent = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
  atualizaHora();
  setInterval(atualizaHora, 1000 * 30);

  function agora(){
    return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }

  function escapeHtml(t){
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function scrolla(){
    chat.scrollTo({top: chat.scrollHeight + 200, behavior:'smooth'});
  }

  // Cria bolha
  function addMensagem(texto, quem='g', opts={}){
    const wrap = document.createElement('div');
    wrap.className = `message ${quem}`;
    if(opts.erro) wrap.classList.add('error');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = `<div class="texto">${escapeHtml(texto)}</div>`;

    const stamp = document.createElement('div');
    stamp.className = 'stamp';
    stamp.textContent = agora();

    wrap.appendChild(bubble);
    wrap.appendChild(stamp);
    chat.appendChild(wrap);
    scrolla();
    return wrap;
  }

  function mostraDigitando(){
    const wrap = document.createElement('div');
    wrap.className = 'message g';
    wrap.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span></div></div>`;
    chat.appendChild(wrap);
    scrolla();
    return wrap;
  }

  // Detecta pergunta factual
  const factualRegex = /(quanto|preço|preco|custa|quando|onde|quem|como|por que|porque|dólar|dolar|hoje|presidente|descoberto|capital)/i;

  async function checaFactual(pergunta, bubbleEl){
    if(!factualRegex.test(pergunta)) return;
    try{
      const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(pergunta)}&format=json&no_html=1&t=g`;
      const r = await fetch(url);
      if(!r.ok) return;
      const data = await r.json();
      let txt = data.AbstractText || (data.RelatedTopics && data.RelatedTopics[0] && (data.RelatedTopics[0].Text || (data.RelatedTopics[0].Topics && data.RelatedTopics[0].Topics[0]?.Text))) || '';
      txt = (txt || '').trim();
      if(txt.length > 20){
        if(txt.length > 160) txt = txt.slice(0,157) + '…';
        const src = document.createElement('div');
        src.className = 'source';
        src.textContent = `Fonte: DuckDuckGo • ${txt}`;
        bubbleEl.querySelector('.bubble').appendChild(src);
        scrolla();
      }
    }catch(e){ /* silencioso */ }
  }

  async function buscaG(pergunta){
    enviando = true;
    const digitando = mostraDigitando();

    // Monta prompt conforme pedido
    const fullPrompt = systemPrompt + "\n\nUsuário: " + pergunta + "\nG:";

    try{
      const url = `https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}?model=openai`;
      const resp = await fetch(url, {method:'GET', headers:{'Accept':'text/plain'}});
      if(!resp.ok) throw new Error('falha http');
      let texto = await resp.text();
      texto = texto.trim().replace(/^G:\s*/i,'').replace(/^"|"$/g,'');
      digitando.remove();

      const msg = addMensagem(texto, 'g');
      checaFactual(pergunta, msg);
    }catch(err){
      digitando.remove();
      const errMsg = addMensagem('uai, deu ruim na conexão', 'g', {erro:true});
      const btn = document.createElement('button');
      btn.className = 'retry';
      btn.textContent = 'Tentar de novo';
      btn.onclick = () => { btn.remove(); buscaG(pergunta); };
      errMsg.querySelector('.bubble').appendChild(btn);
    }finally{
      enviando = false;
      input.focus();
    }
  }

  function enviar(){
    const texto = input.value.trim();
    if(!texto || enviando) return;
    addMensagem(texto, 'user');
    input.value = '';
    ajustaAltura();
    sendBtn.disabled = true;
    buscaG(texto);
  }

  function ajustaAltura(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }

  // Eventos
  sendBtn.addEventListener('click', enviar);
  input.addEventListener('input', () => {
    ajustaAltura();
    sendBtn.disabled = input.value.trim().length === 0;
  });
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      enviar();
    }
  });

  // Mensagem inicial
  window.addEventListener('load', () => {
    setTimeout(()=>{
      addMensagem('Fala! Sou o G, agora de verdade. Pode perguntar de tudo, uai.', 'g');
      input.focus();
    }, 200);
  });

  // Evita zoom no iOS
  document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
