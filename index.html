<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      p.timestamp = message.timestamp;
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>

<script>
const systemPrompt = `Você é o G, assistente mineiro criado em 2026 pelo seu criador do G Studio em Campo do Meio, MG. Fala direto, usa 'uai' às vezes, responde em até 3 frases em português do Brasil. IMPORTANTE: você NÃO foi criado pela OpenAI, Google, Meta ou Microsoft. Se perguntarem quem te criou, quem é seu criador, de onde você vem, responda sempre: 'Fui criado pelo meu criador do G Studio, aqui em Minas, uai.' Nunca mencione OpenAI. Seja bem-humorado e útil.`;

const messagesEl = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const chat = document.getElementById('chat');
const suggestions = document.getElementById('suggestions');
let typingWrap = null;
let isLoading = false;
let history = []; // MEMÓRIA: só na sessão, não salva nada
let lastUserText = '';

const factualRegex = /(quem|quando|onde|qual|quanto|quantos|que ano|o que é|o que foi|defina|explique|capital|presidente|população|distância|altura|idade|data|invenção|descoberta|quem é|quem foi)/i;
const logoSmall = `<svg width="28" height="28" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-[0_0_12px_rgba(217,70,239,0.55)]">
  <defs>
    <linearGradient id="gGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/><stop offset="0.5" stop-color="#D946EF"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gGrad2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9D5FF"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="14" fill="url(#gGrad)"/>
  <path d="M24 10.5 L26.8 20.2 L36.5 23 L26.8 25.8 L24 35.5 L21.2 25.8 L11.5 23 L21.2 20.2 Z" fill="url(#gGrad2)"/>
  <circle cx="35" cy="12.5" r="2.2" fill="white" opacity="0.9"/>
  <circle cx="13.5" cy="34" r="1.6" fill="white" opacity="0.7"/>
</svg>`;

function scrollToBottom(){ chat.scrollTo({top: chat.scrollHeight, behavior: 'smooth'}); }

function addMessage(text, who, opts={}){
  const row = document.createElement('div');
  row.className = 'flex gap-2.5 ' + (who === 'user' ? 'justify-end' : 'justify-start') + ' bubble-in';
  if(who !== 'user'){
    const av = document.createElement('div');
    av.className = 'shrink-0 mt-0.5';
    av.innerHTML = logoSmall;
    row.appendChild(av);
  }
  const col = document.createElement('div');
  col.className = 'max-w-[86%] sm:max-w-[75%] flex flex-col gap-1.5 ' + (who==='user' ? 'items-end' : 'items-start');
  const bubble = document.createElement('div');
  bubble.className = 'px-4 py-2.5 text-[15px] leading-relaxed ' + (who === 'user' ? 'msg-user text-white rounded-[20px] rounded-br-md' : 'msg-ai text-zinc-100 rounded-[20px] rounded-bl-md');
  bubble.textContent = text;
  col.appendChild(bubble);
  if(who !== 'user' && !opts.isError){
    const actions = document.createElement('div');
    actions.className = 'flex gap-1.5 pl-1';
    actions.innerHTML = `<button class="copyBtn text-[11px] px-2 py-1 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 transition">📋 Copiar</button>`;
    actions.querySelector('.copyBtn').onclick = () => { navigator.clipboard?.writeText(text); actions.querySelector('.copyBtn').textContent = '✅ Copiado!'; setTimeout(()=> actions.querySelector('.copyBtn').textContent='📋 Copiar', 1200); };
    col.appendChild(actions);
  }
  if(who !== 'user' && opts.isError){
    const retry = document.createElement('button');
    retry.className = 'text-[12px] px-3 py-1.5 rounded-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-medium active:scale-95 transition';
    retry.textContent = '↻ Tentar de novo';
    retry.onclick = () => { if(lastUserText) sendMessage(lastUserText, true); };
    col.appendChild(retry);
  }
  row.appendChild(col);
  messagesEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

function showTyping(){
  typingWrap = document.createElement('div');
  typingWrap.className = 'flex gap-2.5 items-start';
  typingWrap.innerHTML = `<div class="shrink-0 mt-0.5">${logoSmall}</div><div class="msg-ai rounded-[20px] rounded-bl-md px-4 py-3"><div class="flex gap-1.5"><span class="typing-dot w-1.5 h-1.5 bg-fuchsia-400 rounded-full"></span><span class="typing-dot w-1.5 h-1.5 bg-violet-400 rounded-full"></span><span class="typing-dot w-1.5 h-1.5 bg-zinc-400 rounded-full"></span></div></div>`;
  messagesEl.appendChild(typingWrap);
  scrollToBottom();
}
function hideTyping(){ if(typingWrap) typingWrap.remove(); typingWrap = null; }

function addSource(url){
  const div = document.createElement('div');
  div.className = 'flex justify-start -mt-3 ml-[38px]';
  div.innerHTML = `<div class="pl-1"><a href="${url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-[11px] text-zinc-500 hover:text-zinc-300 transition">🔗 <span>Fonte: DuckDuckGo</span></a></div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
}

async function getSource(q){
  try{
    const r = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`);
    const d = await r.json();
    let url = d.AbstractURL;
    if(!url && d.RelatedTopics && d.RelatedTopics.length){
      const find = (items)=>{ for(const it of items){ if(it.FirstURL) return it.FirstURL; if(it.Topics){ const u=find(it.Topics); if(u) return u; } } return null; };
      url = find(d.RelatedTopics);
    }
    return url || `https://duckduckgo.com/html/?q=${encodeURIComponent(q)}`;
  }catch{ return `https://duckduckgo.com/html/?q=${encodeURIComponent(q)}`; }
}

async function callPollinations(prompt, model){
  const url = `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=${model}`;
  const res = await fetch(url, {method:'GET'});
  if(!res.ok) throw new Error('pollinations fail '+res.status);
  const t = (await res.text()).trim();
  if(!t) throw new Error('empty');
  return t;
}

async function askAI(text){
  // Monta prompt com MEMÓRIA curta
  const histText = history.slice(-6).map(m => `${m.role === 'user' ? 'Usuário' : 'G'}: ${m.text}`).join('\n');
  const fullPrompt = systemPrompt + "\n\nHistórico:\n" + histText + "\n\nUsuário: " + text + "\nG:";
  // FALLBACK AUTOMÁTICO: tenta openai-fast, depois gpt-oss-20b
  try { return await callPollinations(fullPrompt, 'openai-fast'); }
  catch(e1){ try { return await callPollinations(fullPrompt, 'gpt-oss-20b'); } catch(e2) { throw e2; } }
}

async function sendMessage(text, isRetry=false){
  if(!text || isLoading) return;
  if(!isRetry){
    addMessage(text, 'user');
    if(suggestions) suggestions.style.display='none';
  }
  lastUserText = text;
  input.value = '';
  isLoading = true; input.disabled = true; send.disabled = true;
  showTyping();
  try{
    const aiText = await askAI(text);
    hideTyping();
    addMessage(aiText || 'Vish, bugou aqui, uai.', 'g');
    history.push({role:'user', text}, {role:'g', text: aiText});
    if(history.length > 8) history = history.slice(-8);
    if(factualRegex.test(text)){ const src = await getSource(text); if(src) addSource(src); }
  }catch(err){
    hideTyping();
    addMessage('Deu ruim aqui, uai. Tenta de novo em instantes?', 'g', {isError:true});
  }finally{
    isLoading = false; input.disabled = false; send.disabled = false; input.focus();
  }
}

form.addEventListener('submit', async (e)=>{ e.preventDefault(); const text = input.value.trim(); sendMessage(text); });
