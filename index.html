<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      p.timestamp = message.timestamp;
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>
<script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G v2.1</title>
<meta name="theme-color" content="#050507">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Inter,Ubuntu,Arial,sans-serif;overscroll-behavior:contain;background:#050507}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#27272a;border-radius:3px}
  .bubble-in{animation:bubble .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes bubble{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body class="bg-[#050507] text-zinc-100 antialiased selection:bg-violet-500/30 selection:text-violet-100">
<div class="flex flex-col h-[100dvh]">
  <!-- Top Bar -->
  <header class="sticky top-0 z-20 border-b border-zinc-800/80 bg-zinc-950/70 backdrop-blur-xl">
    <div class="mx-auto max-w-3xl px-4 py-3 flex items-center gap-3">
      <div class="relative">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-violet-500 via-fuchsia-600 to-violet-700 flex items-center justify-center font-semibold shadow-[0_0_20px_-5px_rgba(139,92,246,0.6)]">G</div>
        <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 rounded-full border-2 border-zinc-950 animate-pulse"></span>
      </div>
      <div class="min-w-0">
        <h1 class="text-[15px] font-semibold leading-none tracking-tight">G</h1>
        <p class="text-xs text-emerald-400/90 mt-0.5">online</p>
      </div>
    </div>
  </header>

  <!-- Chat -->
  <main id="chat" class="flex-1 overflow-y-auto">
    <div class="mx-auto max-w-3xl px-4 py-6">
      <div id="messages" class="space-y-5 pb-4"></div>
    </div>
  </main>

  <!-- Input -->
  <footer class="sticky bottom-0 z-20 border-t border-zinc-800/80 bg-gradient-to-t from-[#050507] via-[#050507]/95 to-[#050507]/70 backdrop-blur-xl">
    <div class="mx-auto max-w-3xl px-4 pt-3" style="padding-bottom:max(12px,env(safe-area-inset-bottom))">
      <form id="form" class="relative">
        <input id="input" type="text" inputmode="text" enterkeyhint="send" autocomplete="off" placeholder="Fala com o G..." class="w-full h-[52px] bg-zinc-900/80 border border-zinc-800 rounded-2xl pl-4 pr-12 text-[16px] sm:text-[15px] placeholder-zinc-500 outline-none focus:ring-2 focus:ring-violet-500/40 focus:border-violet-500/40 transition" />
        <button id="send" type="submit" aria-label="Enviar" class="absolute right-1.5 bottom-1.5 h-9 w-9 grid place-items-center rounded-xl bg-violet-600 text-white hover:bg-violet-500 active:scale-95 transition disabled:opacity-40 disabled:pointer-events-none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
      <p class="text-[11px] leading-snug text-zinc-500 text-center mt-2.5 px-2">G pode cometer erros. Verifique informações importantes. Não armazena conversas.</p>
    </div>
  </footer>
</div>

<script>
const systemPrompt = `Você é o G, assistente mineiro criado em 2026 pelo seu criador do G Studio em Campo do Meio, MG. Fala direto, usa 'uai' às vezes, responde em até 3 frases em português do Brasil. IMPORTANTE: você NÃO foi criado pela OpenAI, Google, Meta ou Microsoft. Se perguntarem quem te criou, quem é seu criador, de onde você vem, responda sempre: 'Fui criado pelo meu criador do G Studio, aqui em Minas, uai.' Nunca mencione OpenAI. Seja bem-humorado e útil.`;

const messages = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const chat = document.getElementById('chat');
let typingWrap = null;
let isLoading = false;

const factualRegex = /(quem|quando|onde|qual|quanto|quantos|que ano|o que é|o que foi|defina|explique|capital|presidente|população|distância|altura|idade|data|invenção|descoberta|quem é|quem foi)/i;

function scrollToBottom(){
  chat.scrollTo({top: chat.scrollHeight, behavior: 'smooth'});
}

function addMessage(text, who){
  const wrap = document.createElement('div');
  wrap.className = 'flex ' + (who === 'user' ? 'justify-end' : 'justify-start');
  const bubble = document.createElement('div');
  bubble.className = 'bubble-in max-w-[86%] sm:max-w-[75%] px-4 py-2.5 text-[15px] leading-relaxed shadow-[0_4px_24px_-12px_rgba(0,0,0,0.7)] ' + (who === 'user' ? 'bg-gradient-to-br from-violet-600 to-fuchsia-600 text-white rounded-[20px] rounded-br-md' : 'bg-zinc-900 border border-zinc-800 text-zinc-100 rounded-[20px] rounded-bl-md');
  bubble.textContent = text;
  wrap.appendChild(bubble);
  messages.appendChild(wrap);
  scrollToBottom();
  return bubble;
}

function showTyping(){
  typingWrap = document.createElement('div');
  typingWrap.className = 'flex justify-start';
  typingWrap.innerHTML = `<div class="bubble-in bg-zinc-900 border border-zinc-800 rounded-[20px] rounded-bl-md px-4 py-3 shadow-[0_4px_24px_-12px_rgba(0,0,0,0.7)]"><div class="flex gap-1.5"><span class="w-1.5 h-1.5 bg-zinc-600 rounded-full animate-bounce [animation-delay:-0.3s]"></span><span class="w-1.5 h-1.5 bg-zinc-600 rounded-full animate-bounce [animation-delay:-0.15s]"></span><span class="w-1.5 h-1.5 bg-zinc-600 rounded-full animate-bounce"></span></div></div>`;
  messages.appendChild(typingWrap);
  scrollToBottom();
}
function hideTyping(){
  if(typingWrap) typingWrap.remove();
  typingWrap = null;
}

function addSource(url){
  const div = document.createElement('div');
  div.className = 'flex justify-start -mt-3';
  div.innerHTML = `<div class="max-w-[86%] sm:max-w-[75%] pl-1"><a href="${url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-[11px] text-zinc-500 hover:text-zinc-300 transition"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07l1.71-1.71"/></svg><span>Fonte: DuckDuckGo</span></a></div>`;
  messages.appendChild(div);
  scrollToBottom();
}

async function getSource(q){
  try{
    const r = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`);
    const d = await r.json();
    let url = d.AbstractURL;
    if(!url && d.RelatedTopics && d.RelatedTopics.length){
      const find = (items)=>{
        for(const it of items){
          if(it.FirstURL) return it.FirstURL;
          if(it.Topics){ const u = find(it.Topics); if(u) return u; }
        }
        return null;
      };
      url = find(d.RelatedTopics);
    }
    return url || `https://duckduckgo.com/html/?q=${encodeURIComponent(q)}`;
  }catch{
    return `https://duckduckgo.com/html/?q=${encodeURIComponent(q)}`;
  }
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text = input.value.trim();
  if(!text || isLoading) return;
  
  addMessage(text, 'user');
  input.value = '';
  isLoading = true;
  input.disabled = true;
  send.disabled = true;
  showTyping();

  const fullPrompt = systemPrompt + "\n\nUsuário: " + text + "\nG:";
  
  try{
    const url = `https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}?model=openai-fast`;
    const res = await fetch(url, {method:'GET'});
    if(!res.ok) throw new Error('fail');
    const aiText = (await res.text()).trim();
    hideTyping();
    addMessage(aiText || 'Vish, bugou aqui, uai.', 'g');
    
    if(factualRegex.test(text)){
      const src = await getSource(text);
      if(src) addSource(src);
    }
  }catch(err){
    hideTyping();
    addMessage('Deu ruim aqui, uai. Tenta de novo em instantes?', 'g');
  }finally{
    isLoading = false;
    input.disabled = false;
    send.disabled = false;
    input.focus();
  }
});

window.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{ addMessage('Fala! Sou o G, agora de verdade. Pode perguntar de tudo, uai.', 'g'); }, 150);
  input.focus();
});
</script>
</body>
</html>
