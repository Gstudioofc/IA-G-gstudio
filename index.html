<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      p.timestamp = message.timestamp;
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>G Dev - Especialista em Código</title>
<meta name="theme-color" content="#0d1117">
<style>
:root{
  --bg:#0d1117;
  --panel:#161b22;
  --panel-2:#1c2128;
  --border:#30363d;
  --text:#c9d1d9;
  --text-dim:#8b949e;
  --accent:#58a6ff;
  --accent-glow:rgba(88,166,255,.15);
  --code-bg:#010409;
  --green:#3fb950;
  --red:#f85149;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
.app{
  display:flex;
  flex-direction:column;
  height:100dvh;
  height:100vh;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(13,17,23,.85);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 0 rgba(63,185,80,.7);
  animation:pulse 2s infinite;
  flex-shrink:0;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(63,185,80,.6)}
  70%{box-shadow:0 0 0 6px rgba(63,185,80,0)}
  100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}
}
.brand h1{
  margin:0;
  font-size:15px;
  font-weight:600;
  letter-spacing:.2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#e6edf3;
}
.actions{
  display:flex;
  gap:8px;
}
.icon-btn{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-dim);
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
  transition:.15s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--text)}

.chat{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:22px 14px 140px;
  scroll-behavior:smooth;
}
.chat::-webkit-scrollbar{width:10px}
.chat::-webkit-scrollbar-thumb{background:#21262d;border-radius:6px;border:2px solid var(--bg)}
.chat::-webkit-scrollbar-thumb:hover{background:#2d333b}

.msg{
  max-width:880px;
  margin:0 auto 18px;
  display:flex;
  gap:12px;
  animation:fadeIn .25s ease-out;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.msg.user .bubble{
  background:linear-gradient(180deg,#58a6ff,#388bfd);
  color:#0a0f14;
  border-radius:18px 18px 4px 18px;
  padding:11px 14px;
  max-width:min(78%,620px);
  font-size:15px;
  line-height:1.5;
  font-weight:450;
  box-shadow:0 2px 10px rgba(31,111,235,.25);
  word-wrap:break-word;
}
.msg.assistant{
  justify-content:flex-start;
}
.avatar{
  width:28px;
  height:28px;
  border-radius:8px;
  background:linear-gradient(135deg,#1f6feb,#58a6ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  color:white;
  font-size:13px;
  flex-shrink:0;
  margin-top:2px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 2px 6px rgba(0,0,0,.3);
}
.msg.assistant .bubble{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:4px 16px 16px 16px;
  padding:13px 15px;
  max-width:min(88%,720px);
  font-size:14.5px;
  line-height:1.65;
  color:var(--text);
  box-shadow:0 1px 0 rgba(255,255,255,.02) inset;
}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble strong{color:#fff;font-weight:600}
.bubble code.inline{
  background:#0d1117;
  border:1px solid var(--border);
  padding:2px 5px;
  border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,Monaco,"Liberation Mono","Courier New",monospace;
  font-size:13px;
  color:#79c0ff;
}
.code-wrap{
  margin:12px 0 6px;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:var(--code-bg);
}
.code-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 10px 7px 12px;
  background:var(--panel-2);
  border-bottom:1px solid var(--border);
  font-size:12px;
  color:var(--text-dim);
  font-family:ui-monospace,monospace;
}
.code-top span{opacity:.9;text-transform:lowercase}
.copy-btn{
  background:#21262d;
  border:1px solid var(--border);
  color:var(--text-dim);
  padding:3px 8px;
  border-radius:6px;
  font-size:11px;
  cursor:pointer;
  transition:.15s;
  font-family:inherit;
}
.copy-btn:hover{border-color:var(--accent);color:#e6edf3}
.copy-btn.copied{border-color:var(--green);color:var(--green);background:rgba(63,185,80,.1)}
pre{
  margin:0;
  padding:12px 14px;
  overflow-x:auto;
}
pre code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  font-size:13px;
  line-height:1.55;
  color:#e6edf3;
  white-space:pre;
  display:block;
}

.typing{
  max-width:880px;
  margin:0 auto;
  padding:0 14px;
  position:fixed;
  left:0;right:0;
  bottom:108px;
  pointer-events:none;
  z-index:5;
}
.typing[hidden]{display:none}
.typing-bubble{
  display:inline-flex;
  gap:5px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.typing-bubble span{
  width:6px;height:6px;
  background:#6e7681;
  border-radius:50%;
  animation:bounce 1.2s infinite ease-in-out;
}
.typing-bubble span:nth-child(2){animation-delay:.15s}
.typing-bubble span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.6}30%{transform:translateY(-4px);opacity:1}}

.input-area{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:15;
  background:linear-gradient(to top,var(--bg) 65%,rgba(13,17,23,0));
  padding:14px 12px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid transparent;
}
.input-shell{
  max-width:880px;
  margin:0 auto;
}
.input-wrapper{
  display:flex;
  align-items:flex-end;
  gap:8px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:8px 8px 8px 14px;
  transition:border-color .15s, box-shadow .15s;
}
.input-wrapper:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow);
}
#input{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  resize:none;
  max-height:160px;
  min-height:24px;
  padding:7px 0;
  font-family:inherit;
}
#input::placeholder{color:#6e7681}
#send{
  width:36px;height:36px;
  border-radius:10px;
  border:0;
  background:var(--accent);
  color:#051127;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:.15s;
}
#send:hover{filter:brightness(1.08)}
#send:active{transform:scale(.96)}
#send:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.3)}
#send svg{width:18px;height:18px}
.disclaimer{
  text-align:center;
  font-size:11px;
  color:#6e7681;
  margin:8px 0 0;
  user-select:none;
}

@media (max-width:600px){
  .msg.user .bubble{max-width:86%}
  .msg.assistant .bubble{max-width:92%}
  .chat{padding-bottom:150px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="status-dot" aria-hidden="true"></span>
      <h1>G Dev • HTML/CSS/JS/Python</h1>
    </div>
    <div class="actions">
      <button id="clearBtn" class="icon-btn" title="Nova conversa">Limpar</button>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <div id="typing" class="typing" hidden>
    <div class="typing-bubble"><span></span><span></span></div>
  </div>

  <footer class="input-area">
    <div class="input-shell">
      <form id="form" autocomplete="off">
        <div class="input-wrapper">
          <textarea id="input" rows="1" placeholder="Cole seu pedido: 'crie um landing page', 'corrige esse bug'..." enterkeyhint="send"></textarea>
          <button type="submit" id="send" aria-label="Enviar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <p class="disclaimer">G Dev pode errar. Teste sempre o código.</p>
      </form>
    </div>
  </footer>
</div>

<script>
(() => {
  const SYSTEM = `Você é o G Dev, um engenheiro sênior especialista em HTML, CSS, JavaScript, Python, React e Tailwind. Responda em português do Brasil, direto e técnico. Sempre forneça código completo e funcional quando pedido. Use blocos de código markdown com linguagem. Explique brevemente em 1-2 frases antes do código. Nunca use gírias mineiras. Priorize boas práticas, código limpo e comentado.`;

  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const typing = document.getElementById('typing');
  const clearBtn = document.getElementById('clearBtn');

  let messages = []; // {role:'user'|'assistant', content:string}

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMarkdown(md){
    const blocks = [];
    md = md.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) => {
      blocks.push({lang:(lang||'txt').toLowerCase(), code:code.replace(/\s+$/,'')});
      return `@@CODE${blocks.length-1}@@`;
    });

    let html = escapeHtml(md);
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/`([^`\n]+?)`/g, '<code class="inline">$1</code>');
    html = html.replace(/\n/g, '<br>');

    blocks.forEach((b, i) => {
      const codeEsc = escapeHtml(b.code);
      const blockHtml = `<div class="code-wrap"><div class="code-top"><span>${b.lang}</span><button class="copy-btn" type="button">Copiar</button></div><pre><code>${codeEsc}</code></pre></div>`;
      html = html.replace(`@@CODE${i}@@`, blockHtml);
    });
    return html;
  }

  function addMessage(role, content){
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    if(role === 'assistant'){
      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = 'G';
      msg.appendChild(av);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = role === 'user' ? escapeHtml(content).replace(/\n/g,'<br>') : renderMarkdown(content);
    msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function setTyping(show){
    typing.hidden = !show;
    if(show) chat.scrollTop = chat.scrollHeight;
  }

  function autosize(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  function buildPrompt(){
    let p = SYSTEM + "\n\n";
    messages.forEach(m => {
      p += (m.role === 'user' ? 'Usuário' : 'G Dev') + ": " + m.content + "\n\n";
    });
    return p.trim();
  }

  async function callAI(prompt){
    const encoded = encodeURIComponent(prompt);
    try {
      const r1 = await fetch(`https://text.pollinations.ai/${encoded}?model=deepseek`, {method:'GET'});
      if(!r1.ok) throw new Error('deepseek fail');
      return await r1.text();
    } catch(e){
      const r2 = await fetch(`https://text.pollinations.ai/${encoded}?model=openai`, {method:'GET'});
      if(!r2.ok) throw new Error('fallback fail');
      return await r2.text();
    }
  }

  async function handleSend(text){
    if(!text) return;
    addMessage('user', text);
    messages.push({role:'user', content:text});
    messages = messages.slice(-16);

    setTyping(true);
    sendBtn.disabled = true;
    input.value = '';
    autosize();
    input.focus();

    try{
      const prompt = buildPrompt();
      const reply = await callAI(prompt);
      messages.push({role:'assistant', content:reply});
      messages = messages.slice(-16);
      addMessage('assistant', reply);
    }catch(err){
      addMessage('assistant', 'Erro ao conectar à API. Tente novamente em alguns segundos.');
    }finally{
      setTyping(false);
      sendBtn.disabled = false;
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    handleSend(text);
  });

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      form.requestSubmit();
    }
  });
  input.addEventListener('input', autosize);

  document.addEventListener('click', async e => {
    const btn = e.target.closest('.copy-btn');
    if(!btn) return;
    const wrap = btn.closest('.code-wrap');
    const code = wrap.querySelector('pre code').innerText;
    try{
      await navigator.clipboard.writeText(code);
      btn.textContent = 'Copiado!';
      btn.classList.add('copied');
      setTimeout(()=>{btn.textContent='Copiar';btn.classList.remove('copied')},1800);
    }catch{
      btn.textContent = 'Erro';
      setTimeout(()=>btn.textContent='Copiar',1500);
    }
  });

  clearBtn.addEventListener('click', () => {
    messages = [];
    chat.innerHTML = '';
    addMessage('assistant', 'Pronto. Sou especialista em HTML, CSS, JS e Python. Manda o que precisa.');
    input.focus();
  });

  // init
  addMessage('assistant', 'Pronto. Sou especialista em HTML, CSS, JS e Python. Manda o que precisa.');
  autosize();
  input.focus();

  // prevent zoom on iOS double tap input
  document.addEventListener('touchstart',()=>{}, {passive:true});
})();
</script>
</body>
</html>
